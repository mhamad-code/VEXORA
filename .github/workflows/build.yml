name: VEXORA build

# Builds VEXORA on every push, and on demand from the Actions tab:
#   * release APK          (signed with the VEXORA release key, single output: VEXORA.apk)
# The release key is never in the repository; the four signing secrets below
# are read at build time and the decoded keystore lives only in $RUNNER_TEMP.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vexora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VEXORA (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project pins Gradle 9.7.0 in gradle/wrapper and compiles with JVM 17
      # bytecode; its own CI runs on JDK 21, so the build uses the same JDK.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 plus the NDK (27.2.12479018) that builds libharness_local.so
      # and the CMake version the native build pins.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vexora-release.jks"

      - name: Build signed release APK
        env:
          VEXORA_KEYSTORE_FILE: ${{ runner.temp }}/vexora-release.jks
          VEXORA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VEXORA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VEXORA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release signing
        run: |
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signing.txt
          grep -q "CN=VEXORA" signing.txt

      - name: Collect artifacts
        id: artifacts
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VEXORA.apk"
          ls -l dist
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload VEXORA APK
        uses: actions/upload-artifact@v4
        with:
          name: VEXORA
          path: dist/VEXORA.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## VEXORA build"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- Application ID: \`com.agent.mhamed\`"
            echo "- A single signed release APK was produced: \`VEXORA.apk\`."
            echo "- Signing certificate: CN=VEXORA (verified with apksigner)."
          } >> "$GITHUB_STEP_SUMMARY"
